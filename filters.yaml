# Layers 1, 2 and 3a reject. Layer 3b (tag) only annotates.

title:
  # must match one of these to be considered a student role
  include: "intern|interns|internship|co-?op|coop|student|new grad|graduate program"

  # instant reject: seniority
  exclude: "senior|sr\\.|staff|principal|manager|director|supervisor|lead engineer|head of"

  # --- Discipline: mechanical only. Checked in this order. ---
  # 1. never_mechanical: reject, even if a mechanical word is also present
  #    ("Software Engineering Intern - Design Automation", "Robotics - Data Engineering")
  never_mechanical: "software|developer|programm|full[- ]?stack|front[- ]?end|back[- ]?end|\\bweb\\b|mobile|devops|cloud|cyber|\\bsecurity\\b|\\b(?-i:IT)\\b|information technology|\\bdata\\b|analytics|machine learning|\\b(?-i:ML)\\b|\\b(?-i:AI)\\b|artificial intelligence|computer vision|perception|firmware|embedded|\\bFPGA\\b|\\bASIC\\b|\\b(?-i:IC)\\b|analog|mixed[- ]signal|digital design|design verification|silicon|finance|financial|accounting|accountant|audit|\\btax\\b|treasury|\\b(?-i:HR)\\b|human resources|people operations|talent|recruit|marketing|communications|\\bbrand\\b|sales|business|legal|paralegal|procurement|purchasing|buyer|supply chain|logistics|customer (service|success|support|experience)|technical support|product manag|program manag|project coordinat|\\b(?-i:UX)\\b|user experience|graphic|content|\\bhealth\\b|safety|\\bHSE\\b|\\bEHS\\b|environment(al)? (health|science|scien|specialist|planner|advisor|compliance|consult)|neuro|biolog|chemist|clinical|nurs|physics|lab operations|network|systems analyst|\\b(?-i:TA)\\b"

  # 2. electrical: reject unless the title also matches mechanical_override
  electrical: "electrical|electronic|\\bRF\\b|microwave|antenna|power electronics|circuit|\\bPCB\\b|signal integrity|\\b(?-i:EE)\\b"
  mechanical_override: "mechanical|mechatron|electro-?mechanical"

  # 3. mechanical: keep
  mechanical: "mechanical|mechatron|manufactur|\\bCNC\\b|machin(ing|ist|e shop)|\\bCAD\\b|\\bCAM\\b|solidworks|catia|\\bNX\\b|thermal|HVAC|fluid|aero|propulsion|structur|stress|robotic|automation|tooling|weld|fabricat|assembly|e-?coat|paint|coating|stamping|\\bpress\\b|mou?ld|\\bdies?\\b|metrology|quality|test|validation|verification|reliability|durability|design engineer|product design|industrial engineer|process engineer|\\bplant\\b|production|maintenance|millwright|materials|metallurg|battery|powertrain|vehicle|chassis|lean|\\bWCM\\b|world class|continuous improvement|R&D|prototyp|warranty|nuclear|packaging|equipment"

  # 4. generic engineering titles: keep (often open to mech students)
  generic_engineering: "engineer|engineering|technician|technologist|hardware|\\bdesign\\b"

  # 5. anything else: reject

