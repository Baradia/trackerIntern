# Layers 1 and 2 are HARD KILLS. Layer 3 (tag) never rejects anything.

title:
  # must match one of these to be considered a student role
  include: "intern|interns|internship|co-?op|coop|student|new grad|graduate program"

  # instant reject regardless of anything else
  exclude: "senior|sr\\.|staff|principal|manager|director|supervisor|lead engineer|nurse|sales|recruiter|account executive"

  # must also look mechanical-adjacent
  # Widened after reviewing rejected.log: assembly/e-coat/WCM/warranty
  # co-ops in Ontario were being killed here. Broadening is cheap because
  # the location layer runs next and catches the foreign postings.
  discipline: "mechanical|manufactur|design|CNC|machin|CAD|SolidWorks|CATIA|thermal|HVAC|mechatron|robotic|automation|process|product|R&D|test|quality|tooling|weld|fabricat|structural|engineer|assembly|e-?coat|paint|coating|WCM|world class|warranty|maintenance|industrial|technician|technologist|controls|plant|operations|lean|continuous improvement|press|stamping|mold|mould|die |metrology|CAM|millwright|skilled trade|tool and die|materials|supply chain|logistics"

