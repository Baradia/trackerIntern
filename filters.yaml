# Layer 3a: posting-text rules that DO reject. Checked against the title and
# the full posting text, for parsers that provide it (see README).
description_kill:
  itar:
    pattern: "\\bITAR\\b|International Traffic in Arms|22 CFR (Parts? )?12[0-9]"
    # Canadian ITAR roles are usually open to Canadian citizens through the
    # Controlled Goods Program, so they are kept. Delete this line to reject
    # ITAR postings everywhere.
    except_location: "canada|ontario|quebec|british columbia|alberta|nova scotia|manitoba|saskatchewan|new brunswick|\\b(?-i:ON|QC|BC|AB|NS|MB|SK|NB)\\b|toronto|ottawa|montreal|vancouver|calgary|edmonton|waterloo|kitchener|mississauga|brampton|markham|halifax"

# Layer 3b: annotate only. These NEVER reject a posting.
tag:
  us_sponsorship: "without sponsorship|not (be )?able to sponsor|must be a U\\.?S\\.? (person|citizen)|export control"
  upper_year: "3rd year|third year|4th year|fourth year|final year|graduating"
  grad_only: "enrolled in a (Master|PhD|graduate)|MSc|MASc"
  term_4mo: "4[- ]month|four[- ]month"
  term_8mo: "8[- ]month|eight[- ]month|two consecutive"
  security_clearance: "security clearance|controlled goods|reliability status"
  remote: "remote|work from home|hybrid"

# Layer 4: ordering and colour. Green >= 4, yellow >= 1, grey below.
score:
  base: 2
  keywords:
    "co-?op|coop": 2
    "mechanical": 2
    "SolidWorks|CAD|CATIA": 2
    "CNC|machining|sheet metal": 3
    "manufactur|production": 1
    "assembly|e-?coat|paint|coating|stamping|weld": 1
    "WCM|lean|continuous improvement": 1
    "HVAC|thermal": 1
    "first year|1st year|any year|all years": 3
    "Winter 2027|W2027|January 2027": 2
  tags:
    # us_sponsorship deliberately carries no penalty - still tagged so you can
    # see it, but it no longer pushes the posting down the list
    grad_only: -3
    upper_year: -1
    security_clearance: -1
