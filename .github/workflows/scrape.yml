name: coop-tracker

on:
  schedule:
    # every 2 hours, 7am-7pm ET; minute 17 avoids top-of-hour congestion
    - cron: '17 11-23/2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coop-tracker
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Firefox (default) and Chromium for companies with browser: true
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install browsers
        run: python -m playwright install --with-deps firefox chromium

      - name: Run scraper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scraper.py

      - name: Persist state
        run: |
          git config user.name  "coop-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add seen_jobs.json rejected.log || true
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%M)"
          git push
