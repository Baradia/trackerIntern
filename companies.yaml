# IMPORTANT: every token/tenant below is a best guess based on the usual
# naming pattern. Run `python verify.py` before trusting any of them.
# Workday entries need the tenant/wd/site read off the network tab, so they
# ship disabled. Flip `enabled: true` once verify.py confirms them.
#
#   greenhouse      job-boards.greenhouse.io/<token>
#   lever           jobs.lever.co/<token>
#   smartrecruiters careers.smartrecruiters.com/<token>
#   workday         <tenant>.<wd>.myworkdayjobs.com/<site>

defaults:
  user_agent: "UW-CoopTracker/1.0 (+a2baradi@uwaterloo.ca)"
  detail_cap: 25          # max description fetches per company per run

companies:

  # ======================= ONTARIO - COMMERCIAL =========================
  - name: Multimatic
    ats: workday
    tenant: multimatic
    wd: wd10
    site: MMEC
    tier: ontario

  - name: Magna International
    ats: workday
    host: wd3.myworkdaysite.com
    tenant: magna
    site: Magna
    tier: ontario
    search_terms: [intern, co-op, coop, student]
    max_pages_per_term: 5

  - name: Linamar
    ats: oracle
    host: fa-epmd-saasfaprod1.fa.ocs.oraclecloud.com
    site: CX_3001
    tier: ontario

  # Martinrea runs PrevueAPS (martinrea.prevueaps.com) - needs a custom parser
  - name: Martinrea International
    ats: custom
    handler: martinrea
    tier: ontario
    enabled: false

  # jobs.atsautomation.com is a custom domain - check the network tab to see
